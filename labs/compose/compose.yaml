services:
  server:
    image: ${PYTHON_IMAGE:?PYTHON_IMAGE must be digest-locked}
    platform: linux/amd64
    command:
      - python
      - -u
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'hello-docker')
        HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080').status == 200"]
      interval: 2s
      timeout: 2s
      retries: 15
  client:
    image: ${PYTHON_IMAGE:?PYTHON_IMAGE must be digest-locked}
    platform: linux/amd64
    depends_on:
      server:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        import urllib.request
        response = urllib.request.urlopen('http://server:8080', timeout=10)
        payload = response.read().decode()
        print('http=' + str(response.status))
        print('payload=' + payload)
        assert response.status == 200 and payload == 'hello-docker'
